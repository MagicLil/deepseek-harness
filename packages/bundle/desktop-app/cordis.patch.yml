# The dsh-desktop-app bundle patch: the desktop surface over the dsh-base layer.
# Applied after dsh-base's insert; rows here override base rows by id, with
# the profile's own cordis.patch.yml and any --patch overlays still to come.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.
#
# Desktop mounts webserver on 127.0.0.1:3080 and walks +1..+20 on EADDRINUSE
# (a leftover `dsh web` or a stale listen). The desktop-runtime row opens
# Electron at the port that actually bound. LAN rebind belongs to xmart-lan.
# Shared HMR is unused (no module-reload watcher for the Electron shell).
# `dsh --profile desktop --help` provides no desktopStartup, so no window opens.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: >-
      你是万物智汇（X-Mart）的工业软件编程助手，基于 DeepSeek Harness（dsh）构建，由 {{model}} 驱动。当前工作目录是 {{cwd}}。你擅长 MES、QMS、PMS、WMS 及产线周边系统的需求分析、设计实现与联调排障：先核对业务和现场事实，再给可落地的方案与代码，不空谈，不编造接口、表结构或状态。

# Shared HMR is unused on desktop (no module-reload watcher for the Electron shell).
- id: hmr
  disabled: true

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# ── desktop host rows, IPC transport, and the browser roster ────────────────

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: session-log-download
      name: '@deepseek-ai/dsh-session-log-export'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    # Pin the native OS chooser pair — desktop always has a local display.
    # The host half serves `ctx.directoryPicker`; the client surface
    # (`ui-directory-picker-native` in the browser roster below) occupies
    # ui-workspace's directory-flow holes so Add workspace stays visible.
    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: marketplace
      name: '@deepseek-ai/dsh-host-marketplace'

    - id: skill-manager
      name: '@deepseek-ai/dsh-host-skill-manager'

    - id: agent-review
      name: '@deepseek-ai/dsh-host-agent-review'

    - id: workspace-checks
      name: '@deepseek-ai/dsh-host-workspace-checks'
      inject: [subprocess]

    - id: lsp
      name: '@deepseek-ai/dsh-lsp'

    - id: lsp-vue
      name: '@deepseek-ai/dsh-lsp-vue'

    - id: lsp-languages
      name: '@deepseek-ai/dsh-lsp-languages'

    - id: tool-lsp
      name: '@deepseek-ai/dsh-tool-lsp'

    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: desktop-startup
      name: '@deepseek-ai/dsh-desktop-app/startup'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: '127.0.0.1'
        port: 3080
        fallbackPorts: 20

    - id: xmart-lan
      name: '@deepseek-ai/dsh-host-xmart-lan'
      inject: [webServer]

    # Desktop glue: opens Electron after Loader settle at the loopback URL.
    - id: desktop-runtime
      name: '@deepseek-ai/dsh-desktop-app'
      inject: [desktopStartup, connection, webServer]
      config:
        surfaceContext: true

    # Browser plugin roster (dsh.client rows). Wait for webServer so HTTP
    # plugin routes register after listen.
    - id: modules
      name: '@deepseek-ai/dsh-client-modules'
      inject: [webServer]

    # webServer present: registers /api and event WebSockets. The window may
    # still use preload IPC for first-party RPC.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      inject: [webServer]
      config:
        trustedHosts: []

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: client-runtime
      name: '@deepseek-ai/dsh-client-runtime'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    - id: ui-settings-plugin-inventory
      name: '@deepseek-ai/dsh-client-ui-settings-plugin-inventory'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    - id: ui-cordis
      name: '@deepseek-ai/dsh-client-ui-cordis'

    - id: ui-workflow-run
      name: '@deepseek-ai/dsh-client-ui-workflow-run'

    - id: ui-deliverables
      name: '@deepseek-ai/dsh-client-ui-deliverables'

    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    # Client half of the pinned native chooser. Without this Loader row,
    # client-modules never discovers the surface, both directory-flow holes
    # stay empty, and the Add workspace icon / menu entry are hidden.
    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'

    - id: ui-skill
      name: '@deepseek-ai/dsh-client-ui-skill'

    - id: ui-subagent
      name: '@deepseek-ai/dsh-client-ui-subagent'

    - id: ui-jobs
      name: '@deepseek-ai/dsh-client-ui-jobs'

    - id: ui-goal
      name: '@deepseek-ai/dsh-client-ui-goal'

    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'

    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'

    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'

    - id: ui-agent-preset
      name: '@deepseek-ai/dsh-client-ui-agent-preset'

    - id: ui-settings-plugins
      name: '@deepseek-ai/dsh-client-ui-settings-plugins'

    - id: ui-plan
      name: '@deepseek-ai/dsh-client-ui-plan'

    - id: ui-user-questions
      name: '@deepseek-ai/dsh-client-ui-user-questions'

    - id: ui-trajectory
      name: '@deepseek-ai/dsh-client-ui-trajectory'

    # Retired from the conversation view ring; the workbench column owns files.
    - id: ui-editor
      name: '@deepseek-ai/dsh-client-ui-editor'
      disabled: true

    # X-Mart workbench: empty right-hand column beside the conversation.
    - id: ui-xmart-workbench
      name: '@deepseek-ai/dsh-client-ui-xmart-workbench'

    # Community dsh-market owns the Settings market UI; this roster stays off.
    - id: ui-xmart-marketplace
      name: '@deepseek-ai/dsh-client-ui-xmart-marketplace'
      disabled: true

    - id: ui-xmart-skills
      name: '@deepseek-ai/dsh-client-ui-xmart-skills'

    - id: ui-xmart-lan
      name: '@deepseek-ai/dsh-client-ui-xmart-lan'

# ── the agent plane moves behind agent presets (same as web) ────────────────

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard
