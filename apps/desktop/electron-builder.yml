appId: ai.deepseek.harness
productName: xmart
copyright: Copyright © xmart
asar: false
npmRebuild: false
afterPack: ./after-pack.cjs
directories:
  app: ../../.desktop-pack
  output: ../../dist-desktop
  buildResources: build
files:
  - '**/*'
  - '!**/*.map'
  - '!**/tests/**'
  - '!**/src/**'
extraMetadata:
  main: lib/electron-main.js
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: xmart
  artifactName: xmart.${version}.${ext}
portable:
  artifactName: xmart.${version}-portable.${ext}
publish:
  provider: github
  owner: MagicLil
  repo: deepseek-harness
  releaseType: release
